name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    # Ghim 24.04: ubuntu-latest đang chuyển sang 26.04 (19/10–19/11/2026)
    # và mỗi job trên label đó bị GitHub gắn notice.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 不装 QEMU:Dockerfile 里 builder 钉了 $BUILDPLATFORM,arm64 那份是
      # GOARCH 交叉编译出来的,不需要模拟执行。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action 顺带写入 org.opencontainers.image.source 标签,
      # GHCR 靠它把包关联回本仓库(仓库页右侧 Packages 区块的来源)。
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
