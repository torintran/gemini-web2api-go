apiVersion: v1
kind: Namespace
metadata:
  name: gemini
  labels:
    # baseline: initContainer cần root để chown volume local-path.
    # Không dùng restricted vì local-path (hostPath) không áp dụng fsGroup.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
