apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gemini
resources:
  - ../../base
# Image do CI workflow_dispatch đẩy lên GHCR. Tag git v4.26.0 chưa có bản build.
# latest là tag di động; deployment dùng imagePullPolicy Always để node kéo lại.
images:
  - name: ghcr.io/torintran/gemini-web2api-go
    newTag: latest
