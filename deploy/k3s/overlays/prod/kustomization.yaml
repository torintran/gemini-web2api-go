apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gemini
resources:
  - ../../base
# Image do CI trong repo này build rồi đẩy lên GHCR của bạn.
# Mỗi lần build lại nên dùng tag mới, vì IfNotPresent sẽ không kéo lại tag cũ.
images:
  - name: ghcr.io/torintran/gemini-web2api-go
    newTag: v4.26.0
